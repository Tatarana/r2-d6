# deploy.yml - a cada push na main: typecheck e testes; se passarem, deploy na Fly.io.
# Precisa do segredo FLY_API_TOKEN e da variavel DEPLOY_ENABLED=true no repositorio (Settings > Secrets and variables > Actions).
name: ci-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: r2d6
          POSTGRES_PASSWORD: r2d6
          POSTGRES_DB: r2d6_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U r2d6" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://r2d6:r2d6@127.0.0.1:5432/r2d6_test
      DATABASE_URL_TEST: postgres://r2d6:r2d6@127.0.0.1:5432/r2d6_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm run data:build
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    # so depois de configurar a Fly: variavel de repositorio DEPLOY_ENABLED=true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
