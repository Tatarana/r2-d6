<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- app.icon: dado de seis faces pintado como o R2-D2 (corpo branco com paineis azuis, topo prateado de cupula com o
       olho preto e a lente vermelha; as luzes do droide fazem o papel dos pips). Bordas ciano luminosas do app.
       O dado cabe no circulo central de 80% (zona segura do icone "maskable" do Android). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#12324A"/><stop offset="1" stop-color="#05070C"/></radialGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2F5F9"/><stop offset=".55" stop-color="#BFC8D4"/><stop offset="1" stop-color="#8E99A8"/></linearGradient>
    <linearGradient id="bodyL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4E9F0"/><stop offset="1" stop-color="#B9C2CF"/></linearGradient>
    <linearGradient id="bodyR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D3DAE4"/></linearGradient>
    <radialGradient id="lens" cx="40%" cy="38%" r="60%"><stop offset="0" stop-color="#FF6A5A"/><stop offset=".45" stop-color="#B3121C"/><stop offset="1" stop-color="#3A0408"/></radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(1.15) translate(-256 -262)">
    <!-- faces -->
    <polygon points="132,190 256,118 380,190 256,262" fill="url(#dome)"/>
    <polygon points="132,190 256,262 256,406 132,334" fill="url(#bodyL)"/>
    <polygon points="256,262 380,190 380,334 256,406" fill="url(#bodyR)"/>

    <!-- topo (cupula) = face 1: o olho do R2 e o pip; paineis azuis nos cantos -->
    <g transform="matrix(124 -72 124 72 132 190)">
      <rect x=".07" y=".07" width=".22" height=".1" fill="#2B5DAE"/>
      <rect x=".71" y=".07" width=".22" height=".1" fill="#2B5DAE"/>
      <rect x=".07" y=".83" width=".22" height=".1" fill="#2B5DAE"/>
      <rect x=".71" y=".83" width=".22" height=".1" fill="#2B5DAE"/>
      <circle cx=".5" cy=".5" r=".19" fill="#0A0D12"/>
      <circle cx=".5" cy=".5" r=".11" fill="url(#lens)"/>
      <circle cx=".46" cy=".46" r=".03" fill="#FFFFFF" opacity=".85"/>
    </g>

    <!-- lado esquerdo = face 3: pips na diagonal (o do meio e a luz vermelha do R2); paineis azuis entre eles -->
    <g transform="matrix(124 72 0 144 132 190)">
      <rect x=".06" y=".42" width=".1" height=".5" fill="#2B5DAE"/>
      <rect x=".46" y=".08" width=".46" height=".12" fill="#2B5DAE"/>
      <rect x=".62" y=".3" width=".3" height=".06" fill="#2B5DAE"/>
      <circle cx=".27" cy=".27" r=".11" fill="#14223A"/>
      <circle cx=".5" cy=".5" r=".11" fill="#E5323C"/>
      <circle cx=".73" cy=".73" r=".11" fill="#14223A"/>
    </g>

    <!-- lado direito = face 2: um pip e o projetor holografico; painel azul e grade de ventilacao -->
    <g transform="matrix(124 -72 0 144 256 262)">
      <rect x=".5" y=".08" width=".42" height=".2" fill="#2B5DAE"/>
      <rect x=".08" y=".56" width=".3" height=".34" fill="#2B5DAE"/>
      <rect x=".5" y=".36" width=".36" height=".045" fill="#7C8796"/>
      <rect x=".5" y=".45" width=".36" height=".045" fill="#7C8796"/>
      <circle cx=".27" cy=".27" r=".11" fill="#14223A"/>
      <circle cx=".73" cy=".73" r=".11" fill="#0A0D12"/>
      <circle cx=".73" cy=".73" r=".055" fill="#9FD6FF"/>
    </g>

    <!-- bordas luminosas -->
    <g fill="none" stroke="#4FD1FF" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
      <polygon points="256,118 380,190 380,334 256,406 132,334 132,190"/>
      <polyline points="132,190 256,262 380,190"/>
      <line x1="256" y1="262" x2="256" y2="406"/>
    </g>
  </g>
</svg>
