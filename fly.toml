# fly.toml - r2-d6 na Fly.io: uma maquina sempre ligada (Socket.IO da mesa), volume para retratos, Postgres no Neon.
# Segredos (fly secrets set): DATABASE_URL, BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SIGNUP_ALLOWLIST
# e, se usar, ANTHROPIC_API_KEY. Login so com Google (sem e-mail e senha). Passo a passo em docs/deploy.md.

app = "r2-d6"
primary_region = "gru"

[build]

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  APP_URL = "https://r2-d6.fly.dev"
  STORAGE_DRIVER = "local"
  MEDIA_DIR = "/data/media"
  SIGNUP_MODE = "invite"
  EMAIL_LOGIN = "off"

# migracoes antes de cada deploy (se falharem, a versao nova nao entra)
[deploy]
  release_command = "npm run db:migrate -w @r2d6/api"

[mounts]
  source = "r2d6_media"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
