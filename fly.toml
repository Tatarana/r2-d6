# fly.toml app configuration file generated for r2-d6 on 2026-11-02T13:09:54-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'r2-d6'
primary_region = 'gru'

[build]
[deploy]
  release_command = 'npm run db:migrate -w @r2d6/api'

[env]
  APP_URL = 'https://r2-d6.fly.dev'
  EMAIL_LOGIN = 'off'
  HOST = '0.0.0.0'
  MEDIA_DIR = '/data/media'
  NODE_ENV = 'production'
  PORT = '3000'
  SIGNUP_MODE = 'invite'
  STORAGE_DRIVER = 'local'

[[mounts]]
  source = 'r2d6_media'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/readyz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
